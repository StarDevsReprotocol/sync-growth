<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync Growth — Authorization Complete</title>
<link rel="icon" type="image/png" href="/bot.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #3B82F6;
  --blue-bright: #60A5FA;
  --yellow: #FACC15;
  --green: #22c55e;
  --red: #ef4444;
  --bg: #070a12;
  --bg-2: #0d1220;
  --card: #121826;
  --border: #1e2739;
  --text: #e5e7eb;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg-gradient {
  background:
    radial-gradient(ellipse 60% 40% at 15% 15%, rgba(59, 130, 246, 0.15), transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 85%, rgba(250, 204, 21, 0.10), transparent 60%);
}
.bg-grid {
  background-image:
    linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
}
.card {
  background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  width: 100%;
  max-width: 460px;
  padding: 40px 32px 36px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--blue-bright), var(--yellow), transparent);
}
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.logo { width: 52px; height: 52px; border-radius: 14px; border: 2px solid rgba(59, 130, 246, 0.35); box-shadow: 0 0 24px rgba(59, 130, 246, 0.3); flex-shrink: 0; }
.brand h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.8px; background: linear-gradient(90deg, var(--blue-bright), var(--yellow)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand p { font-size: 12px; color: var(--text-mute); margin-top: 2px; letter-spacing: 0.3px; }
.status { border-radius: 14px; padding: 22px 20px; display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; border: 1px solid; }
.status.success { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.28); }
.status.error { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.28); }
.status.info { background: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.28); }
.status-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 22px; }
.status.success .status-icon { background: rgba(34, 197, 94, 0.15); }
.status.error .status-icon { background: rgba(239, 68, 68, 0.15); }
.status.info .status-icon { background: rgba(59, 130, 246, 0.15); }
.status-text h2 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.status.success .status-text h2 { color: #4ade80; }
.status.error .status-text h2 { color: #f87171; }
.status.info .status-text h2 { color: var(--blue-bright); }
.status-text p { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.section-label::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: linear-gradient(180deg, var(--blue-bright), var(--yellow)); }
.code-box { background: linear-gradient(180deg, #0a0e1a 0%, #0d1220 100%); border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px; text-align: center; font-family: 'SF Mono', Consolas, monospace; font-size: 20px; font-weight: 800; color: var(--blue-bright); letter-spacing: 2px; user-select: all; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; text-shadow: 0 0 24px rgba(96, 165, 250, 0.4); word-break: break-all; }
.code-box:hover { border-color: rgba(59, 130, 246, 0.5); background: linear-gradient(180deg, #0d1220 0%, #101827 100%); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
.code-box:active { transform: scale(0.99); }
.code-box.copied { color: #4ade80; border-color: rgba(34, 197, 94, 0.5); text-shadow: 0 0 24px rgba(34, 197, 94, 0.4); }
.code-hint { text-align: center; font-size: 11.5px; color: var(--text-mute); margin-top: 12px; letter-spacing: 0.3px; }
.footer-hint { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--text-dim); }
.footer-hint code { background: rgba(59, 130, 246, 0.15); color: var(--blue-bright); padding: 3px 9px; border-radius: 6px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px; font-weight: 600; border: 1px solid rgba(59, 130, 246, 0.2); }
.loader-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 0 8px; }
.spinner { width: 48px; height: 48px; position: relative; }
.spinner::before, .spinner::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
.spinner::before { border-top-color: var(--blue-bright); border-right-color: var(--blue-bright); animation: spin 1s linear infinite; }
.spinner::after { inset: 10px; border-bottom-color: var(--yellow); border-left-color: var(--yellow); animation: spin 1.4s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13px; color: var(--text-mute); letter-spacing: 0.3px; }
.error-msg { color: #f87171; font-size: 13px; margin-top: 14px; text-align: center; font-weight: 500; min-height: 18px; }
</style>

<style id="sync-growth-redesign">

.card,.step,.feature,.stat-card,.info-card,.content-card,.faq-item{

footer{border-top:1px solid var(--sg-line)!important;color:var(--sg-muted)!important}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#sg-particles{display:none!important}}

<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-grid"></div>

<div class="card">
  <div class="header">
    <img src="/bot.png" alt="Sync Growth" class="logo" onerror="this.style.display='none'">
    <div class="brand">
      <h1>SYNC GROWTH</h1>
      <p>Authorization Portal</p>
    </div>
  </div>

  <div id="dynamic-content">
    <div class="loader-wrap">
      <div class="spinner"></div>
      <div class="loader-text">Finalizing authorization...</div>
    </div>
  </div>

  <p class="error-msg" id="error"></p>
</div>

<script>
const UPSTASH_URL = "https://keen-goose-317190.upstash.io";
const UPSTASH_TOKEN = "gQAAAAAABNcGAAIgcDIyMTM0MTdmZDUwNzc0NmQ5OWFhODIxOWRhYWE3ZjU3Nw";
const KEY_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

// No prefix — matches website.js generateAuthKey()
function generateAuthKey() {
  const bytes = new Uint8Array(10);
  crypto.getRandomValues(bytes);
  let key = "";
  for (let i = 0; i < 10; i++) key += KEY_ALPHABET[bytes[i] % KEY_ALPHABET.length];
  return key;
}

async function redisGet(key) {
  const res = await fetch(UPSTASH_URL + "/get/" + encodeURIComponent(key), {
    method: "POST",
    headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
  });
  const data = await res.json();
  return data.result;
}

async function redisSet(key, rawString) {
  const res = await fetch(UPSTASH_URL + "/set/" + encodeURIComponent(key) + "/" + encodeURIComponent(rawString), {
    method: "POST",
    headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return true;
}

function safeParse(raw) {
  if (!raw) return {};
  try {
    let obj = JSON.parse(raw);
    if (typeof obj === "string") obj = JSON.parse(obj);
    if (typeof obj !== "object" || obj === null || Array.isArray(obj)) return {};
    return obj;
  } catch (_) { return {}; }
}

function renderSuccess(authKey) {
  document.getElementById("dynamic-content").innerHTML = `
    <div class="status success">
      <div class="status-icon">✅</div>
      <div class="status-text">
        <h2>Authorization Complete</h2>
        <p>Copy the key below and paste it in Discord to finish.</p>
      </div>
    </div>
    <div class="section-label">Authorization Code</div>
    <div class="code-box" id="code-box">${authKey}</div>
    <div class="code-hint" id="code-hint">Tap the code to copy</div>
    <div class="footer-hint">
      Paste in Discord using <code>!auth ${authKey}</code>
    </div>
  `;

  const box = document.getElementById("code-box");
  const hint = document.getElementById("code-hint");
  box.addEventListener("click", () => {
    navigator.clipboard.writeText(authKey);
    const orig = box.textContent;
    box.textContent = "✅ Copied!";
    box.classList.add("copied");
    hint.textContent = "Copied to clipboard";
    hint.style.color = "#4ade80";
    setTimeout(() => {
      box.textContent = orig;
      box.classList.remove("copied");
      hint.textContent = "Tap the code to copy";
      hint.style.color = "";
    }, 1600);
  });
}

function renderError(title, msg) {
  document.getElementById("dynamic-content").innerHTML = `
    <div class="status error">
      <div class="status-icon">❌</div>
      <div class="status-text">
        <h2>${title}</h2>
        <p>${msg}</p>
      </div>
    </div>
  `;
}

(async function () {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const errorEl = document.getElementById("error");

  if (!code || !state) {
    renderError("Authorization Failed", "Missing code or state in URL. Please restart the flow with !authlink.");
    errorEl.textContent = "Missing params. Run !authlink again.";
    return;
  }

  try {
    const raw = await redisGet("memberera:oauthCodes");
    const oauthBlob = safeParse(raw);
    if (!oauthBlob[state] || typeof oauthBlob[state] !== "object") {
      oauthBlob[state] = { bot1_code: null, bot2_code: null, created_at: Date.now() };
    }
    oauthBlob[state].bot2_code = code;
    await redisSet("memberera:oauthCodes", JSON.stringify(oauthBlob));

    const authKey = generateAuthKey();

    const rawCodes = await redisGet("memberera:authCodes");
    const authBlob = safeParse(rawCodes);
    authBlob[authKey] = { state, used: false, created_at: Date.now() };
    await redisSet("memberera:authCodes", JSON.stringify(authBlob));

    const verifyRaw = await redisGet("memberera:authCodes");
    const verifyBlob = safeParse(verifyRaw);
    if (!verifyBlob[authKey]) {
      throw new Error("Key write verification failed. Please try again in a moment.");
    }

    renderSuccess(authKey);
  } catch (e) {
    renderError("Authorization Failed", e.message);
    errorEl.textContent = "Error: " + e.message;
  }
})();
</script>


<script>
(()=> {
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce)return;
 const c=document.createElement('canvas');c.id='sg-particles';document.body.prepend(c);
 const ctx=c.getContext('2d',{alpha:true});if(!ctx)return;
 let w=0,h=0,dpr=1,pts=[],raf=0,last=0,visible=true;
 const mobile=()=>innerWidth<700;
 function resize(){
   dpr=Math.min(devicePixelRatio||1,1.25);w=innerWidth;h=innerHeight;
   c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);
   c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
   const count=Math.min(mobile()?34:68,Math.max(20,Math.floor(w*h/(mobile()?19000:15500))));
   pts=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,
    vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:.7+Math.random()*1.5,
    a:.22+Math.random()*.48,hue:Math.random()<.55?190:255}));
 }
 function draw(t){
   raf=requestAnimationFrame(draw);if(!visible||t-last<30)return;last=t;
   ctx.clearRect(0,0,w,h);
   for(let i=0;i<pts.length;i++){
     const p=pts[i];p.x+=p.vx;p.y+=p.vy;
     if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;if(p.y<-8)p.y=h+8;if(p.y>h+8)p.y=-8;
     ctx.beginPath();ctx.fillStyle=`hsla(${p.hue},95%,75%,${p.a})`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
     for(let j=i+1;j<pts.length;j++){
       const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,dist=dx*dx+dy*dy;
       if(dist<105*105){ctx.strokeStyle=`rgba(111,165,255,${.095*(1-Math.sqrt(dist)/105)})`;
        ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
     }
   }
 }
 document.addEventListener('visibilitychange',()=>{visible=!document.hidden});
 addEventListener('resize',resize,{passive:true});resize();raf=requestAnimationFrame(draw);
})();
</script>
